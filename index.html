<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO ===== -->
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="合同会社Classless｜AIとコミュニティで、プロジェクトを前へ" />
    <meta
      property="og:description"
      content="合同会社Classlessは、AI事業「アクセル」とコミュニティ組成事業を展開。n8nのワークフロー設計、データベース管理、サイト制作から、Tokyo Global Hubやちいきのかまどなど人と地域をつなぐ取り組みまで支援します。"

    <meta name="theme-color" content="#ffffff" />

    <!--
      First-paint shell: the prerendered copy remains in the document for search
      engines and no-JS visitors, while JavaScript visitors see a branded frame
      until React commits. This script intentionally runs before the body exists
      so the SEO copy can never flash unstyled.
    -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        document.documentElement.classList.add('js', 'classless-booting');
        document.documentElement.setAttribute('data-boot-route', path === '/' ? 'home' : 'inner');
      }());
    </script>
    <style>
      :root{color-scheme:light}html,body{margin:0;min-height:100%;background:#fff}
      .boot-shell{display:none}.seo-prerender{box-sizing:border-box;width:min(100% - 48px,960px);margin:auto;padding:96px 0;color:#14283f;font-family:sans-serif;line-height:1.8}.seo-prerender h1{font-size:clamp(30px,5vw,56px);line-height:1.35}.seo-prerender h2{margin-top:56px}.seo-prerender img{max-width:100%;height:auto}
      .js.classless-booting .seo-prerender{display:none!important}.js.classless-booting .boot-shell{display:block;position:relative;min-height:100svh;overflow:hidden;background:#fff;color:#14283f;font-family:var(--font-jp,'Noto Sans JP',sans-serif)}
      .boot-shell--handoff{position:fixed!important;inset:0;z-index:1000;display:block!important;opacity:1;transition:opacity .2s ease-out}.boot-shell--exit{opacity:0}
      .boot-header,.boot-home__content{box-sizing:border-box;width:100%;max-width:1320px;margin:auto;padding-inline:clamp(24px,5vw,64px)}
      .boot-header{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f4}.boot-logo{width:178px;height:auto;display:block}.boot-nav{display:flex;gap:30px;align-items:center}.boot-nav span{height:8px;width:65px;background:#e6ecf0}.boot-nav span:last-child{width:145px;height:46px;background:#14283f}
      .boot-home,.boot-inner{display:none}.js.classless-booting[data-boot-route="home"] .boot-home{display:flex}.js.classless-booting[data-boot-route="inner"] .boot-inner{display:block}
      .boot-home{position:relative;min-height:680px;height:calc(100svh - 80px);max-height:900px;align-items:center;isolation:isolate}.boot-home__content{position:relative;z-index:2;padding-block:44px 115px}.boot-statement{font-size:13px;font-weight:600;letter-spacing:.025em;color:#1674a5;margin:0 0 28px}.boot-title{font-size:clamp(50px,6.8vw,96px);font-weight:700;line-height:1.32;letter-spacing:.01em;margin:0 0 30px}.boot-title>span{display:block}.boot-tagline{font-size:16px;line-height:2.1;margin:0 0 32px;color:#566574}.boot-link{font-size:14px;font-weight:700;padding:12px 0;line-height:1.7}
      .boot-panel{position:absolute;right:0;top:32px;bottom:80px;width:45%;border-radius:0 0 0 96px;background:#e5eff5;overflow:hidden;z-index:-1}.boot-panel:before{content:'';position:absolute;width:92%;height:76%;top:-20%;right:-24%;border:clamp(45px,7vw,110px) solid #c5dce9;border-radius:50%;box-sizing:border-box}.boot-panel:after{content:'';position:absolute;width:75%;height:76%;bottom:-25%;left:13%;border:clamp(40px,6vw,90px) solid #91bed4;border-radius:50%;box-sizing:border-box}
      .boot-inner{padding:100px 8vw}.boot-inner__title{width:55%;height:54px;background:#edf2f5}.boot-inner__line{width:70%;height:12px;background:#f3f6f8;margin-top:28px}
      @media(max-width:1100px){.boot-panel{width:42%}.boot-title{font-size:clamp(50px,6.8vw,84px)}}
      @media(max-width:960px){.boot-nav span:not(:last-child){display:none}.boot-home{min-height:650px;max-height:780px}.boot-panel{width:40%;top:70px;bottom:100px}.boot-title{font-size:clamp(48px,7vw,68px)}.boot-statement{font-size:12px}.boot-tagline{font-size:14px}}
      @media(max-width:680px){.boot-header{height:70px}.boot-logo{width:145px}.boot-nav span:last-child{width:95px;height:38px}.js.classless-booting[data-boot-route="home"] .boot-home{display:block}.boot-home{box-sizing:border-box;height:auto;min-height:760px;max-height:none;padding-top:55px;padding-bottom:265px}.boot-home__content{padding-block:0}.boot-statement{font-size:10px;margin-bottom:24px}.boot-title{font-size:clamp(38px,9.6vw,61px);line-height:1.4;margin-bottom:23px}.boot-tagline{font-size:13px;line-height:2;margin-bottom:18px}.boot-link{font-size:13px}.boot-panel{top:auto;bottom:65px;height:205px;width:72%;border-radius:0 0 0 50px}}
      @media(max-width:360px){.boot-logo{width:126px}.boot-home{min-height:730px}.boot-statement{font-size:9px}}
      @media(prefers-reduced-motion:reduce){.boot-shell--handoff{transition:none}}
    </style>
    <noscript><style>.boot-shell{display:none!important}.seo-prerender{display:block!important}</style></noscript>

    <!-- ===== Google Analytics (GA4) =====
         旧サイトで使用していた測定ID(G-E72Y97T6QC)を復元。
         別IDに変える場合は2箇所の G-E72Y97T6QC を置き換えてください。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E72Y97T6QC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E72Y97T6QC');
    </script>
    <!-- ===== End Google Analytics ===== -->
  </head>
  <body>
    <div id="root" data-prerender="true">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-header">
          <img class="boot-logo" src="/assets/logo-classless-horizontal.png" alt="" width="164" height="44" />
          <div class="boot-nav"><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="boot-home">
          <div class="boot-home__content">
            <p class="boot-statement">Beyond borders. Beyond possibilities.</p>
            <div class="boot-title"><span>AIで、人間を</span><span>面白くする。</span></div>
            <p class="boot-tagline">テクノロジーと、人のつながりで。<br />新しい挑戦が動き出す、その土台をつくる。</p>
            <div class="boot-link">私たちの事業について　→</div>
          </div>
          <span class="boot-panel"></span>
        </div>
        <div class="boot-inner">
          <div class="boot-inner__eyebrow"></div>
          <div class="boot-inner__title"></div>
          <div class="boot-inner__line"></div>
          <div class="boot-inner__line"></div>
          <div class="boot-inner__cards"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="seo-prerender"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
